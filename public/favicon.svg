<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="50%" stop-color="#0080FF" />
      <stop offset="100%" stop-color="#7928CA" />
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070B14" />
      <stop offset="100%" stop-color="#0D1527" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background circle with cyber border -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)" stroke="#1E2D52" stroke-width="2" />

  <!-- Shield Shape -->
  <path d="M32 10 L48 16 C48 34 32 48 32 54 C32 48 16 34 16 16 Z" 
        fill="url(#shieldGrad)" 
        opacity="0.25" />
  
  <path d="M32 10 L48 16 C48 34 32 48 32 54 C32 48 16 34 16 16 Z" 
        fill="none" 
        stroke="url(#shieldGrad)" 
        stroke-width="3" 
        stroke-linecap="round" 
        stroke-linejoin="round"
        filter="url(#glow)" />

  <!-- Inner Protective Acoustic Wave / Checkmark -->
  <path d="M25 31 L30 36 L40 24" 
        fill="none" 
        stroke="#00F0FF" 
        stroke-width="3.5" 
        stroke-linecap="round" 
        stroke-linejoin="round" 
        filter="url(#glow)" />

  <!-- Live Pulse Dot -->
  <circle cx="32" cy="46" r="2.5" fill="#10B981" />
</svg>
